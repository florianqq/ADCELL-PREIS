name: ADCELL Preise aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1'
      timezone: 'Europe/Berlin'

permissions:
  contents: write

concurrency:
  group: adcell-price-update
  cancel-in-progress: false

jobs:
  preise:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Shopify-Preise abrufen und ADCELL aktualisieren
        env:
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: python scripts/update_adcell.py
      - name: CSV-Aktualisierung speichern
        run: |
          git add -- '508524-0.csv'
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'ADCELL-Preise aus Shopify aktualisieren'
            git push
          fi
